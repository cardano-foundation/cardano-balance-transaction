name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: nix-enabled-runners
    steps:
      - uses: actions/checkout@v6

      - uses: cachix/cachix-action@v15
        with:
          name: paolino
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Build
        run: nix build .#lib --quiet

      - name: Test
        run: nix run .#unit-tests --quiet

      - name: Fourmolu
        run: nix develop .#ci --command fourmolu -m check lib test

      - name: HLint
        run: nix develop .#ci --command hlint lib test

      - name: Nixfmt
        run: nix develop .#ci --command nixfmt --check flake.nix nix/*.nix

  docs:
    runs-on: nix-enabled-runners
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/cachix-action@v15
        with:
          name: paolino
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - run: nix develop github:paolino/dev-assets?dir=mkdocs -c mkdocs build --strict
